services:
  - type: web
    name: wonderland-backend
    runtime: docker
    repo: https://github.com/XPSTARTS/wonderland-toy-store  # Replace this
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: wonderland-db
          property: connectionString

databases:
  - name: wonderland-db
    plan: free
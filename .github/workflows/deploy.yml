name: Build and Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WonderlandBackend.csproj

      - name: Build
        run: dotnet build WonderlandBackend.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish WonderlandBackend.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderland-api
          path: ./publish
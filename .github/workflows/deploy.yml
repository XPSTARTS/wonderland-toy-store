name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: List files (Debug)
        run: ls -la

      - name: Restore dependencies
        run: dotnet restore WonderlandBackend.sln

      - name: Build
        run: dotnet build WonderlandBackend.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test WonderlandBackend.sln --no-build --verbosity normal

      - name: Publish
        run: dotnet publish WonderlandBackend.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderland-api
          path: ./publish